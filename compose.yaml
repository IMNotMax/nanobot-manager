services:
  # ============================================================================
  # NANOBOT-MANAGER
  # ============================================================================
  # IMPORTANT: Configuration des permissions
  # 
  # Le container s'exécute avec les permissions de l'utilisateur courant (PUID/PGID)
  # pour éviter les problèmes de permissions sur les fichiers partagés.
  #
  # Pour récupérer vos UID/GID automatiquement:
  #   Sur Linux/Mac: id -u && id -g
  #   Ou: echo "PUID=$(id -u)" >> .env && echo "PGID=$(id -g)" >> .env
  #
  # Pour l'utilisateur agent_smith sur Neo (192.168.2.202):
  #   PUID=1001
  #   PGID=1001
  #
  # Si non définis, utilise 1000:1000 par défaut
  # ============================================================================
  
  nanobot-manager:
    build: ./nanobot-manager
    container_name: nanobot-manager
    # Exécute le container avec les permissions de l'utilisateur courant
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "8899:8899"
    volumes:
      # Configuration nanobot (lecture/écriture avec permissions utilisateur)
      # On monte seulement le fichier pour éviter les problèmes de permissions sur le répertoire
      - ~/.nanobot/config.json:/home/agent_smith/.nanobot/config.json
      # SSH keys pour le mode Host
      - ~/.ssh/nanobot-manager:/home/agent_smith/.ssh
      # Configuration propre à nanobot-manager
      - ./manager_data:/app/config
    environment:
      - CONFIG_PATH=/home/agent_smith/.nanobot/config.json
      - MANAGER_CONFIG_PATH=/app/config/manager.json
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - HTTP_PORT=${HTTP_PORT:-8899}
      - DOCKER_PROXY_URL=http://socket-proxy:2375
      - HOST_SSH_USER=${HOST_SSH_USER}
      - HOST_SSH_HOST=${HOST_SSH_HOST}
      - HOST_SSH_PORT=${HOST_SSH_PORT:-22}
      - HOME=/home/agent_smith
    networks:
      - socket-proxy-network
    restart: unless-stopped
    
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: socket-proxy
    environment:
      - TZ=America/Toronto
      - ALLOW_START=1
      - ALLOW_STOP=1
      - ALLOW_RESTARTS=1
      - AUTH=1
      - BUILD=0
      - COMMIT=0
      - CONFIGS=1
      - CONTAINERS=1
      - DISABLE_IPV6=0
      - DISTRIBUTION=0
      - EVENTS=1
      - EXEC=1
      - IMAGES=1
      - INFO=0
      - LOG_LEVEL=info
      - NETWORKS=1
      - NODES=0
      - PING=1
      - PLUGINS=0
      - POST=0
      - SECRETS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=1
      - SYSTEM=0
      - TASKS=0
      - VERSION=1
      - VOLUMES=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
    networks:
      - socket-proxy-network
      
networks:
  socket-proxy-network:
    driver: bridge
    # Uncomment the line below if you want to use an existing external network
    # external: true
